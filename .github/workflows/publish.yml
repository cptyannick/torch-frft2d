name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing:
# https://docs.pypi.org/trusted-publishers/  (no API token needed)
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.5"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # no cache in release jobs, so a poisoned cache can't reach the published build
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(uv version --short)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - run: uv build
      - name: Smoke-test the distributions
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$dist" --with torch \
              --index https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match \
              python -c "import torch, torch_frft2d as t; print(t.__version__, t.frft2d_multi(torch.randn(1, 8, 8), torch.rand(1, 2)).shape)"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torch-frft2d
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # PEP 740 attestations; uv publish uploads them alongside the distributions
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
      - run: uv publish
