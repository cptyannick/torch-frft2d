name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing:
# https://docs.pypi.org/trusted-publishers/  (no API token needed)
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(uv version --short)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl --with torch \
            --index https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match \
            python -c "import torch, torch_frft2d as t; print(t.__version__, t.frft2d_multi(torch.randn(1, 8, 8), torch.rand(1, 2)).shape)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torch-frft2d
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10
      - run: uv publish
